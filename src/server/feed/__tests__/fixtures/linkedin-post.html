<title>ComfyUI Raises $30M at $500M Valuation | Robin Huang posted on the topic | LinkedIn</title>
<meta name="description" content="We just closed $30 million financing at a $500 million valuation, bringing our total funding to $47 million. 

The round was led by Craft Ventures, with participation from Pace Capital, Chemistry, Tru Arrow Partners, and others.

Here's where the funding goes.

Comfy Cloud. Not everyone has high-end local compute and not every studio wants to stand up their own infrastructure, so we're building the managed version.

Collaborative workflows. Creative work is rarely solo, but ComfyUI in studios still operates like it is, so we're building features for teams to share, version, and iterate together.

Comfy Local. The power has always lived here, and we're investing to make it seamless and stable.

Ecosystem stability. 60,000 community nodes are one of the best things about ComfyUI and one of the hardest to keep reliable, so we're investing in the standards and infrastructure that make them stable on Local and Cloud and easier to build.

Model support. Every major model release should work in ComfyUI on day one, not a week later after someone patches it in, and the integrations and partnerships we're building make that a guarantee.

We're not building a walled garden. We're building open infrastructure, the kind that lasts and empowers rather than locks in.

If you'd like to join our mission, apply here: https://comfy.org/careers | 77 comments on LinkedIn">
